{% for car in cars %}
<div class="col">
    <a href="{{ url_for('car_details', slug=car.slug) }}" class="text-decoration-none">
        <div class="card h-100 car-card shadow-sm border-0">
            <div style="height: 350px; overflow: hidden; border-radius: 8px 8px 0 0;">
                {% if car.thumbnail %}
                <img src="{{ url_for('serve_car_photo', folder=car.folder, filename=car.thumbnail) }}" 
                     class="w-100 h-100" style="object-fit: cover;" 
                     alt="Used {{ car.year }} {{ car.name }} for sale in Philippines - {{ car.type }}">
                {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center h-100 text-muted">No Photo</div>
                {% endif %}
            </div>
            <div class="card-body p-3 text-dark">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge bg-secondary">{{ 'Used' }}</span>
                </div>
                <h2 class="card-title fw-bold mb-1 fs-5">{{ car.year }} {{ car.name }}</h2>
                <p class="h5 text-danger fw-bold mb-3">
                    {{ car.display_price }}
                    {% if car.original_price and car.price < car.original_price %}
                    <span class="badge bg-danger ms-2" style="font-size: 0.7em;">PRICE REDUCED</span>
                    {% endif %}
                </p>
                <div class="btn btn-outline-dark btn-sm w-100 rounded-pill">View Full Details</div>
            </div>
        </div>
    </a>
</div>
{% endfor %}
